# Retrieval eval: for each question, the HireFlow records a good search must surface.
# `relevant` lists document ids (kind:uuid). Any one of them in the top k counts as a hit;
# recall@k counts how many of them made it. Runs offline, no API key, on every CI build.
#
# Ids: jobs 2000..., candidates 3000..., applications 4000... (see src/hireflow_copilot/data/hireflow_seed.json)

